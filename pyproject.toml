[project]
name = "hintly"
version = "0.1.0"
description = "Educational exploration of Anthropic Agent Skills with Google Classroom integration"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]
dspy = ["dspy-ai>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.hatch.build.targets.wheel]
packages = ["core"]

